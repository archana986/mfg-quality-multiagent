command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "${DATABRICKS_APP_PORT:-8000}"
  - --server.address
  - "0.0.0.0"

env:
  - name: STREAMLIT_SERVER_ENABLE_CORS
    value: "false"
  - name: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
    value: "false"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: MFG_CATALOG
    value: main
  - name: MFG_SCHEMA
    value: mfg_quality_agent
  - name: MFG_LLM_ENDPOINT
    value: databricks-claude-sonnet-4-5
  - name: MFG_VS_ENDPOINT
    value: mfg_quality_vs_endpoint
